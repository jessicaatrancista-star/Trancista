<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAEBD6">
<title>Jéssica Ferreira · Trancista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAEBD6;--card:#FFF8EE;--card2:#F4E1C8;--line:#E8D2B6;
  --brown:#6D4930;--brown2:#8A6447;--text:#4A3122;--muted:#9A7B62;
  --gold:#C9A46A;--danger:#A0442F;--ok:#5E7A4C;
  --r:16px;--sh:0 6px 22px rgba(109,73,48,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Montserrat,system-ui,sans-serif;font-size:15px}
body{min-height:100vh;overscroll-behavior-y:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:16px;color:var(--text)}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
/* barra */
#bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;height:58px;padding:0 8px;background:rgba(250,235,214,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#bar.hidden{display:none}
#barTitle{flex:1;text-align:center;font-family:'Playfair Display',serif;font-weight:600;font-size:18px;color:var(--brown)}
.bar-r{width:42px;display:flex;justify-content:flex-end}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--brown)}
.icon-btn:active{background:var(--card2)}
.icon-btn svg{width:24px;height:24px}
#view{padding:16px 16px 40px}
#view.enter{animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* tipografia */
h1,h2,h3{font-family:'Playfair Display',serif;color:var(--brown);margin:0}
.script{font-family:'Great Vibes',cursive;color:var(--brown)}
.muted{color:var(--muted)}
.small{font-size:13px}
.sec-t{font-family:'Playfair Display',serif;font-size:17px;color:var(--brown);margin:22px 2px 10px;font-weight:600}
/* botões */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 18px;border-radius:14px;background:var(--brown);color:#FAEBD6;font-weight:600;font-size:15px;letter-spacing:.3px;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--brown);border:1.5px solid var(--brown)}
.btn.soft{background:var(--card2);color:var(--brown)}
.btn.danger{background:var(--danger)}
.btn.sm{min-height:40px;width:auto;font-size:13px;padding:0 14px;border-radius:12px}
.btn svg{width:20px;height:20px}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:10px}
.row>*{flex:1}
.stack>*+*{margin-top:12px}
/* cartões */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.card+.card{margin-top:12px}
.list-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;width:100%;text-align:left}
.list-item+.list-item{margin-top:10px}
.list-item:active{background:var(--card2)}
.li-main{flex:1;min-width:0}
.li-t{font-weight:600;color:var(--text)}
.li-s{font-size:13px;color:var(--muted);margin-top:3px}
.li-v{font-weight:700;color:var(--brown);white-space:nowrap}
.chev{color:var(--muted);width:18px;height:18px;flex:none}
.list-item>svg:not(.chev){width:22px;height:22px;flex:none;color:var(--brown)}
/* home */
.hero{text-align:center;padding:10px 0 0}
.hero img{width:min(78vw,340px);display:block;margin:0 auto}
.hero p{margin:-6px 0 22px;color:var(--brown2);font-size:14px;letter-spacing:.4px}
.info-line{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;font-size:13px;color:var(--muted)}
.info-line svg{width:16px;height:16px}
.foot-link{display:block;margin:34px auto 0;font-size:13px;color:var(--brown2);text-decoration:underline;text-underline-offset:3px}
.specks{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55}
#app>*{position:relative;z-index:1}
/* form */
.field{display:block}
.field+.field{margin-top:14px}
.field>span{display:block;font-size:13px;font-weight:600;color:var(--brown2);margin:0 2px 6px}
.inp{width:100%;height:52px;border-radius:14px;border:1.5px solid var(--line);background:#FFFCF7;padding:0 14px;outline:none}
textarea.inp{height:auto;min-height:90px;padding:12px 14px;resize:vertical}
.inp:focus{border-color:var(--brown2)}
.inp.err{border-color:var(--danger);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:14px;color:var(--brown)}
.chip.on{background:var(--brown);border-color:var(--brown);color:#FAEBD6}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600;color:var(--brown)}
.slot.on,.slot:active{background:var(--brown);color:#FAEBD6;border-color:var(--brown)}
/* calendário */
.cal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--sh)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-head b{font-family:'Playfair Display',serif;font-size:17px;color:var(--brown);text-transform:capitalize}
.cal-head .icon-btn[disabled]{opacity:.25}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-w{font-size:12px;font-weight:700;color:var(--muted);padding:6px 0}
.cal-d{position:relative;aspect-ratio:1;border-radius:12px;font-weight:600;font-size:15px;color:var(--brown)}
.cal-d.off{color:#CDB8A0;font-weight:500}
.cal-d.hoje{box-shadow:inset 0 0 0 1.5px var(--gold)}
.cal-d.sel{background:var(--brown);color:#FAEBD6}
.cal-d.lotado{background:#F1DFC8;color:#B39678;text-decoration:line-through}
.cal-d.folga{background:repeating-linear-gradient(135deg,#EFD9BE 0 5px,#F7E6D0 5px 10px);color:var(--muted);text-decoration:line-through}
.cal-d i{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:var(--gold)}
.cal-d.sel i{background:#FAEBD6}
.cal-d:not(.off):active{background:var(--card2)}
/* resumo */
.resumo{display:grid;gap:8px}
.resumo div{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.resumo div span:first-child{color:var(--muted)}
.resumo div span:last-child{font-weight:600;text-align:right}
.resumo .tot{border-top:1px dashed var(--line);padding-top:10px;margin-top:2px}
.resumo .tot span:last-child{color:var(--brown);font-size:17px}
/* sucesso */
.ok-ico{width:84px;height:84px;border-radius:50%;background:var(--brown);display:grid;place-items:center;margin:18px auto 14px;animation:pop .4s ease}
.ok-ico svg{width:44px;height:44px;color:#FAEBD6}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1)}}
/* painel */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.stat b{display:block;font-family:'Playfair Display',serif;font-size:22px;color:var(--brown)}
.stat span{font-size:11.5px;color:var(--muted);font-weight:600}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 12px;text-align:left;box-shadow:var(--sh);min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.menu button:active{background:var(--card2)}
.menu svg{width:26px;height:26px;color:var(--brown)}
.menu b{font-size:14px;color:var(--text);margin-top:10px}
.lembrete{border:1.5px solid var(--gold);background:linear-gradient(180deg,#FFF6E6,#FFF8EE)}
.lembrete h3{font-size:16px;display:flex;align-items:center;gap:8px}
.lembrete h3 svg{width:20px;height:20px}
.lem-it{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.lem-it:first-of-type{border-top:0}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--card2);color:var(--brown2)}
.tag.ok{background:#E3EBD8;color:var(--ok)}
.tag.can{background:#F3DDD5;color:var(--danger)}
.tag.ag{background:#F6E5C6;color:#8A6427}
.hora-b{font-family:'Playfair Display',serif;font-weight:700;font-size:17px;color:var(--brown);width:56px}
.empty{text-align:center;padding:26px 10px;color:var(--muted);font-size:14px}
/* stepper */
.stepper{display:flex;align-items:center;justify-content:space-between;background:#FFFCF7;border:1.5px solid var(--line);border-radius:14px;height:52px;padding:0 4px}
.stepper b{font-size:17px;color:var(--brown)}
.stepper .icon-btn{width:44px;height:44px;font-size:22px;font-weight:600}
/* financeiro */
.big{font-family:'Playfair Display',serif;font-size:32px;color:var(--brown);font-weight:700}
.bar-row{margin-top:12px}
.bar-row .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bar-row .t{height:10px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar-row .t i{display:block;height:100%;background:var(--brown2);border-radius:99px}
/* flyer */
.fly-prev{display:block;width:62%;margin:0 auto;border-radius:14px;box-shadow:0 10px 30px rgba(109,73,48,.25)}
/* modal */
.modal-wrap{position:fixed;inset:0;z-index:50;background:rgba(58,36,22,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-wrap.show{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:520px;max-height:90vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .25s}
.modal-wrap.show .modal{transform:none}
.modal::before{content:'';display:block;width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 6px}
.m-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.m-head h3{font-size:19px}
.m-body{font-size:15px;line-height:1.5}
.m-body p{margin:4px 0 8px}
.m-foot{display:flex;gap:10px;margin-top:18px}
.m-foot .btn{flex:1}
/* toast */
#toasts{position:fixed;left:0;right:0;top:12px;z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}
.toast{max-width:480px;width:100%;background:var(--brown);color:#FAEBD6;border-radius:14px;padding:13px 16px;font-size:14px;font-weight:500;box-shadow:0 10px 26px rgba(58,36,22,.3);transform:translateY(-20px);opacity:0;transition:.25s;display:flex;gap:10px;align-items:center}
.toast.in{transform:none;opacity:1}
.toast.err{background:var(--danger)}
.toast svg{width:20px;height:20px;flex:none}
.splash{text-align:center;padding-top:12vh}.splash img{width:min(70vw,300px)}
.spin{width:34px;height:34px;margin:10px auto;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brown);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.hint{background:var(--card2);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--brown2);margin-top:12px}
</style>
</head>

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const hoje=()=>ymd(new Date());
const addDias=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const SEM=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const SEMC=['D','S','T','Q','Q','S','S'];
const SEMA=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const fmtData=s=>{const d=parse(s);return SEM[d.getDay()]+', '+d.getDate()+' de '+MESES[d.getMonth()]};
const fmtCurta=s=>{const d=parse(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

/* ---------- disponibilidade ---------- */
function diaAberto(s){const h=S.horario;if(s<hoje())return false;if(s>addDias(hoje(),60))return false;if(h.folgas.includes(s))return false;return!!h.dias[parse(s).getDay()]}
function regra(s,dur,ign){
  const R=S.horario.regra||{longo:420,extraQtd:1,extraMax:240};
  const dia=ocupacoes(s,ign);
  const longos=dia.filter(a=>a.dur>=R.longo),outros=dia.length-longos.length;
  if(longos.length){
    if(dur>=R.longo)return{ok:false,motivo:`Já existe um penteado longo (${durTxt(longos[0].dur)}) agendado neste dia. Para este serviço, escolha outro dia.`};
    if(outros>=R.extraQtd)return{ok:false,motivo:'A agenda deste dia já está completa. Escolha outro dia.'};
    if(dur>R.extraMax)return{ok:false,motivo:`Neste dia só cabe mais um serviço de até ${durTxt(R.extraMax)}. Escolha outro dia ou um serviço mais curto.`};
  }else if(dur>=R.longo&&(dia.length>R.extraQtd||dia.some(a=>a.dur>R.extraMax))){
    return{ok:false,motivo:'Este dia já tem atendimentos marcados e não comporta um penteado longo. Escolha outro dia.'};
  }
  return{ok:true};
}
function alertaDia(motivo){modal({titulo:'Dia indisponível',corpo:`<p>${esc(motivo)}</p>`,botoes:[{texto:'Escolher outro dia'}]})}
function vagas(s,dur,ign){
  if(!diaAberto(s))return[];
  if(!regra(s,dur,ign).ok)return[];
  const h=S.horario,ini=toMin(h.inicio),fim=toMin(h.fim);
  const ocup=ocupacoes(s,ign).map(a=>[toMin(a.hora),toMin(a.hora)+a.dur]);
  let agora=-1;if(s===hoje()){const n=new Date();agora=n.getHours()*60+n.getMinutes()}
  const out=[];
  for(let t=ini;t+dur<=fim;t+=h.passo){if(t<=agora)continue;if(ocup.some(([a,b])=>t<b&&t+dur>a))continue;out.push(toHora(t))}
  return out;
}

function modal({titulo,corpo='',botoes=[],aoAbrir,dispensar}){
  const m=$('#modal');
  m.innerHTML=`<div class="m-head"><h3>${esc(titulo)}</h3><button class="icon-btn m-x" aria-label="Fechar">${IC.x}</button></div><div class="m-body">${corpo}</div>${botoes.length?'<div class="m-foot"></div>':''}`;
  aoDispensar=dispensar||null;
  const pe=m.querySelector('.m-foot');
  botoes.forEach(b=>{
    const el=document.createElement('button');el.className='btn '+(b.cls||'');el.innerHTML=b.texto;
    el.onclick=async()=>{if(b.acao){const r=await b.acao(m);if(r===false)return}aoDispensar=null;await fecharModal();b.depois&&b.depois()};
    pe.appendChild(el);
  });
  m.querySelector('.m-x').onclick=()=>fecharModal();
  if(!modalAberto){modalAberto=true;history.pushState({m:1},'')}
  $('#modalWrap').classList.add('show');m.scrollTop=0;
  aoAbrir&&aoAbrir(m);
}
function fecharModal(){return new Promise(r=>{if(!modalAberto)return r();fecharResolve=r;history.back()})}

function aviso(msg,tipo=''){

  $('#toasts').appendChild(t);requestAnimationFrame(()=>t.classList.add('in'));

/* ---------- calendário próprio ---------- */
function calendario(el,o){
  let ref=parse(o.sel||hoje());let y=ref.getFullYear(),m=ref.getMonth()+1;
  const minMes=o.minMes||null;
  function d(){
    const first=new Date(y,m-1,1).getDay(),n=new Date(y,m,0).getDate();
    const mesAtual=y+'-'+pad(m);
    let h=`<div class="cal"><div class="cal-head"><button class="icon-btn cal-p" ${minMes&&mesAtual<=minMes?'disabled':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button><b>${MESES[m-1]} ${y}</b><button class="icon-btn cal-n"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button></div><div class="cal-grid">`;
    h+=SEMC.map(x=>`<span class="cal-w">${x}</span>`).join('');
    for(let i=0;i<first;i++)h+='<span></span>';
    for(let dd=1;dd<=n;dd++){
      const s=mesAtual+'-'+pad(dd);const ok=o.ok?o.ok(s):true;const mk=o.marca?o.marca(s):0;const cl=o.classe?o.classe(s):'';
      h+=`<button class="cal-d ${ok?'':'off'} ${cl} ${s===o.sel?'sel':''} ${s===hoje()?'hoje':''}" data-d="${s}" ${ok?'':'disabled'}>${dd}${mk?'<i></i>':''}</button>`;
    }
    el.innerHTML=h+'</div></div>';
    el.querySelector('.cal-p').onclick=()=>{m--;if(m<1){m=12;y--}d()};
    el.querySelector('.cal-n').onclick=()=>{m++;if(m>12){m=1;y++}d()};
    el.querySelectorAll('.cal-d:not(.off)').forEach(b=>b.onclick=()=>{o.sel=b.dataset.d;d();o.escolher(o.sel)});
  }
  d();return{redesenhar:d};
}
function escolherData(titulo,sel,ok){
  return new Promise(res=>modal({titulo,corpo:'<div id="mCal"></div>',dispensar:()=>res(null),
    aoAbrir:m=>calendario(m.querySelector('#mCal'),{sel,ok,escolher:async s=>{aoDispensar=null;await fecharModal();res(s)}})}));
}
function stepper(el,{valor,min,max,passo,fmt,mudar}){
  const d=()=>{el.innerHTML=`<div class="stepper"><button class="icon-btn" data-a="-">−</button><b>${fmt(valor)}</b><button class="icon-btn" data-a="+">+</button></div>`;
    el.querySelectorAll('button').forEach(b=>b.onclick=()=>{const nv=valor+(b.dataset.a==='+'?passo:-passo);if(nv<min||nv>max)return;valor=nv;d();mudar(valor)})};
  d();
}

function lembretesAmanha(){const am=addDias(hoje(),1);return S.ags.filter(a=>a.data===am&&a.status==='agendado').sort((a,b)=>a.hora.localeCompare(b.hora))}
function textoLembrete(a){return S.cfg.msg.replace(/\{nome\}/g,a.cliente.split(' ')[0]).replace(/\{data\}/g,fmtData(a.data)).replace(/\{hora\}/g,a.hora).replace(/\{servico\}/g,a.servNome)}
function enviarLembrete(a){abrir(waLink(a.tel,textoLembrete(a)));a.lembrado=true;updateDoc(doc(db,'agendamentos',a.id),{lembrado:true}).catch(console.error)}
function intervalo(per){
  const t=parse(hoje());let ini,fim;
  if(per==='hoje'){ini=fim=hoje()}
  else if(per==='semana'){const dw=(t.getDay()+6)%7;ini=addDias(hoje(),-dw);fim=addDias(ini,6)}
  else if(per==='mes'){ini=ymd(new Date(t.getFullYear(),t.getMonth(),1));fim=ymd(new Date(t.getFullYear(),t.getMonth()+1,0))}
  else if(per==='ano'){ini=t.getFullYear()+'-01-01';fim=t.getFullYear()+'-12-31'}
  else{ini='0000-00-00';fim='9999-99-99'}
  return[ini,fim];
}
function faturado(ini,fim){
  const ag=S.ags.filter(a=>a.status==='concluido'&&a.data>=ini&&a.data<=fim);
  const ex=S.extras.filter(e=>e.data>=ini&&e.data<=fim);
  return{ag,ex,qtd:ag.length+ex.length,total:ag.reduce((s,a)=>s+Number(a.preco),0)+ex.reduce((s,e)=>s+Number(e.valor),0)};
}

function editarServico(s){

  const bts=[];

const logoImg=new Image();logoImg.src=LOGO;
let fly={tema:'claro',enfeite:'nenhum',titulo:'Vagas disponíveis',dias:[{data:'',horas:''}],info:'Garanta já o seu horário!',rodape:'Agende pelo link ou chame no WhatsApp'};
const MAX_DIAS=6;
function quebrar(c,txt,larg){const out=[];String(txt).split('\n').forEach(par=>{let l='';par.split(' ').forEach(w=>{const t=l?l+' '+w:w;if(c.measureText(t).width>larg&&l){out.push(l);l=w}else l=t});out.push(l)});return out}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

/* ---- enfeites do flyer ---- */
function semente(n){let sd=n;return()=>{sd=(sd*9301+49297)%233280;return sd/233280}}
function bola(c,x,y,r,cor){
  c.fillStyle=cor;c.beginPath();c.arc(x,y,r,0,7);c.fill();
  c.fillStyle='rgba(255,255,255,.45)';c.beginPath();c.ellipse(x-r*.35,y-r*.35,r*.28,r*.18,-.6,0,7);c.fill();
  c.fillStyle='#C9A46A';c.fillRect(x-r*.3,y-r-6,r*.6,8);
}
function guirlanda(c,W,dark){
  const r=semente(11),x0=40,x1=W-40,y0=46,sag=78;const P=t=>[x0+(x1-x0)*t,y0+sag*4*t*(1-t)];
  const verdes=['#2F5D3A','#3B7049','#24482D','#4C8459'];
  c.lineCap='round';
  for(let i=0;i<=1100;i++){const[x,y]=P(i/1100);for(let k=0;k<2;k++){const a=r()*Math.PI*2,l=12+r()*16;c.strokeStyle=verdes[(r()*4)|0];c.lineWidth=3;c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l*.8);c.stroke()}}
  const cores=['#A8323A','#C9A46A','#A8323A','#E7D2A8','#A8323A','#C9A46A','#A8323A','#E7D2A8','#A8323A'];
  for(let k=1;k<=9;k++){const[x,y]=P(k/10);const q=26+(k%2)*30;c.strokeStyle='rgba(201,164,106,.9)';c.lineWidth=2;c.beginPath();c.moveTo(x,y);c.lineTo(x,y+q);c.stroke();bola(c,x,y+q+18,k%2?18:15,cores[k-1])}
}
function folhaAzevinho(c,x,y,ang,esc){
  c.save();c.translate(x,y);c.rotate(ang);c.scale(esc,esc);
  c.fillStyle='#2F6B3F';c.beginPath();c.moveTo(0,0);
  const pts=[[18,-14],[34,-6],[50,-18],[64,-6],[80,-14],[92,0],[80,14],[64,6],[50,18],[34,6],[18,14]];
  pts.forEach(([a,b])=>c.lineTo(a,b));c.closePath();c.fill();
  c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=2;c.beginPath();c.moveTo(4,0);c.lineTo(86,0);c.stroke();c.restore();
}
function azevinho(c,x,y,flip){
  const f=flip?-1:1;
  folhaAzevinho(c,x,y,flip?Math.PI+.35:-.35,1.25);folhaAzevinho(c,x,y,flip?Math.PI-.55:.55,1.1);folhaAzevinho(c,x,y,flip?-Math.PI/2-.2:-Math.PI/2+.2,1);
  [[0,0],[14*f,10],[-6*f,14]].forEach(([a,b])=>{c.fillStyle='#A8323A';c.beginPath();c.arc(x+a,y+b,11,0,7);c.fill();c.fillStyle='rgba(255,255,255,.5)';c.beginPath();c.arc(x+a-3,y+b-3,3,0,7);c.fill()});
}
function floco(c,x,y,r,cor){
  c.strokeStyle=cor;c.lineWidth=2.5;c.lineCap='round';
  for(let i=0;i<6;i++){const a=i*Math.PI/3,cx=Math.cos(a),sy=Math.sin(a);c.beginPath();c.moveTo(x,y);c.lineTo(x+cx*r,y+sy*r);c.stroke();
    const m=r*.55,b=r*.28;[1,-1].forEach(sg=>{const a2=a+sg*.7;c.beginPath();c.moveTo(x+cx*m,y+sy*m);c.lineTo(x+cx*m+Math.cos(a2)*b,y+sy*m+Math.sin(a2)*b);c.stroke()})}
}
function fogos(c,x,y,r,cor1,cor2,seed){
  const rn=semente(seed);c.lineCap='round';
  for(let i=0;i<28;i++){const a=i/28*Math.PI*2+rn()*.08,r1=r*(.22+rn()*.1),r2=r*(.75+rn()*.25);
    c.strokeStyle=i%2?cor1:cor2;c.lineWidth=3.5;c.beginPath();c.moveTo(x+Math.cos(a)*r1,y+Math.sin(a)*r1);c.lineTo(x+Math.cos(a)*r2,y+Math.sin(a)*r2);c.stroke();
    c.fillStyle=i%2?cor2:cor1;c.beginPath();c.arc(x+Math.cos(a)*(r2+9),y+Math.sin(a)*(r2+9),4,0,7);c.fill()}
  c.fillStyle=cor1;c.beginPath();c.arc(x,y,6,0,7);c.fill();
}
function brilho(c,x,y,r,cor){c.fillStyle=cor;c.beginPath();c.moveTo(x,y-r);c.quadraticCurveTo(x,y,x+r,y);c.quadraticCurveTo(x,y,x,y+r);c.quadraticCurveTo(x,y,x-r,y);c.quadraticCurveTo(x,y,x,y-r);c.fill()}
function serpentina(c,x,y,dx,dy,cor,seed){
  c.strokeStyle=cor;c.lineWidth=5;c.lineCap='round';c.beginPath();
  for(let i=0;i<=120;i++){const t=i/120,a=t*Math.PI*7+seed;const px=x+dx*t+Math.cos(a)*16,py=y+dy*t+Math.sin(a)*16;i?c.lineTo(px,py):c.moveTo(px,py)}c.stroke();
}
function confetes(c,W,H,dark,seed){
  const rn=semente(seed),cores=['#C9A46A','#E7C98A','#8A6447',dark?'#FAEBD6':'#B5884E','#D9B77A'];
  const zonas=[[60,60,230,620],[W-230,60,W-60,620],[60,1640,230,1860],[W-230,1640,W-60,1860]];
  zonas.forEach(([a,b,cc,d])=>{for(let i=0;i<26;i++){const x=a+rn()*(cc-a),y=b+rn()*(d-b);c.save();c.translate(x,y);c.rotate(rn()*3);c.fillStyle=cores[(rn()*cores.length)|0];
    if(rn()<.5)c.fillRect(-9,-4,18,8);else{c.beginPath();c.arc(0,0,5,0,7);c.fill()}c.restore()}});
}
function enfeites(c,W,H,dark,fase){
  const e=fly.enfeite;if(e==='nenhum'||fundoImg[e])return;
  if(e==='fio'){
    if(fase==='fundo'){const rn=semente(5);const cor=dark?'rgba(250,235,214,.75)':'rgba(201,164,106,.75)';
      [[120,300,26],[200,520,18],[960,330,24],[880,560,16],[110,620,14],[970,640,18],].forEach(([x,y,r])=>floco(c,x,y,r,cor));return}
    guirlanda(c,W,dark);
  }else if(e==='anonovo'){
    if(fase==='fundo'){confetes(c,W,H,dark,21);
      fogos(c,160,300,120,'#C9A46A',dark?'#FAEBD6':'#8A6447',3);fogos(c,925,230,95,dark?'#FAEBD6':'#8A6447','#C9A46A',8);fogos(c,960,500,60,'#E7C98A','#C9A46A',13);
      [[250,150,16],[820,420,14],[130,520,12],[980,1720,18],[100,1700,14]].forEach(([x,y,r])=>brilho(c,x,y,r,'#C9A46A'));return}
    serpentina(c,60,1660,170,190,'#C9A46A',0);serpentina(c,W-60,1660,-170,190,dark?'#FAEBD6':'#8A6447',2);
  }
}
async function desenharFlyer(cv){

    esc_=true;fg='#F7E7C8';fg2='#EAD7B4';
    if(!foto.complete)await new Promise(r=>{foto.onload=r;foto.onerror=r});
    const k=Math.max(W/foto.naturalWidth,H/foto.naturalHeight),iw=foto.naturalWidth*k,ih=foto.naturalHeight*k;

    const g2=c.createLinearGradient(0,H-380,0,H);g2.addColorStop(0,'rgba(0,0,0,0)');g2.addColorStop(.45,'rgba(0,0,0,.5)');g2.addColorStop(1,'rgba(0,0,0,.6)');c.fillStyle=g2;c.fillRect(0,H-380,W,380);
    c.strokeStyle='rgba(231,201,138,.75)';c.lineWidth=3;rr(c,44,44,W-88,H-88,30);c.stroke();
    c.shadowColor='rgba(0,0,0,.6)';c.shadowBlur=14;
  }else{
    c.fillStyle=bg;c.fillRect(0,0,W,H);
    let sd=7;const rnd=()=>{sd=(sd*9301+49297)%233280;return sd/233280};
    for(let i=0;i<170;i++){c.fillStyle=`rgba(201,164,106,${.25+rnd()*.45})`;c.beginPath();c.ellipse(rnd()*W,rnd()*H,2+rnd()*7,2+rnd()*5,rnd()*3,0,7);c.fill()}
    c.strokeStyle='rgba(201,164,106,.8)';c.lineWidth=3;rr(c,44,44,W-88,H-88,30);c.stroke();
  }
  enfeites(c,W,H,esc_,'fundo');

  else c.drawImage(logoImg,W/2-LS/2,y-20,LS,LS);
  enfeites(c,W,H,esc_,'frente');
  c.textAlign='center';
  const corpo=(y,des)=>{
    const F=(fn)=>{if(des)fn()};
    c.fillStyle=fg;let fs=150;c.font=`${fs}px "Great Vibes"`;while(c.measureText(fly.titulo).width>W-160&&fs>70){fs-=6;c.font=`${fs}px "Great Vibes"`}
    y+=fs*.75;F(()=>c.fillText(fly.titulo||'',W/2,y));y+=50;
    F(()=>{c.strokeStyle='rgba(201,164,106,.9)';c.lineWidth=3;c.beginPath();c.moveTo(W/2-150,y);c.lineTo(W/2+150,y);c.stroke()});y+=95;
    const dias=fly.dias.filter(d=>d.data.trim()||d.horas.trim());const cp=dias.length>1;
    const dF=cp?'700 50px "Playfair Display"':'700 62px "Playfair Display"',dL=cp?60:76;
    const pw=cp?168:210,ph=cp?72:96,gap=cp?16:22,por=cp?5:4,hF=cp?'600 36px Montserrat':'600 46px Montserrat';
    dias.forEach((d,di)=>{
      if(d.data.trim()){c.font=dF;c.fillStyle=fg;quebrar(c,d.data,W-180).forEach(l=>{F(()=>{c.font=dF;c.fillStyle=fg;c.fillText(l,W/2,y)});y+=dL});y+=cp?8:20}
      const hs=d.horas.split(/[,;\n]+/).map(s=>s.trim()).filter(Boolean).slice(0,12);

  const de=()=>{$('#enf').innerHTML=[['nenhum','Sem enfeite'],['fio','🎄 Fio de Natal'],['natalVerde','🎄 Natal verde'],['anoAzul','🎆 Ano Novo azul'],['anoDourado','✨ Ano Novo dourado']].map(([k,n])=>`<button class="chip ${fly.enfeite===k?'on':''}" data-k="${k}">${n}</button>`).join('');
    $('#enf').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const ant=fly.enfeite;fly.enfeite=b.dataset.k;
      if(Object.values(TIT).includes(fly.titulo)&&fly.titulo===TIT[ant]){fly.titulo=TIT[fly.enfeite];$('#fT').value=fly.titulo}
      de();redraw()});$('#boxTema').style.display=fundoImg[fly.enfeite]?'none':''};de();
  [['fT','titulo'],['fI','info'],['fR','rodape']].forEach(([id,k])=>$('#'+id).oninput=e=>{fly[k]=e.target.value;redraw()});
  const dd=()=>{
    const box=$('#dias');
    box.innerHTML=fly.dias.map((d,i)=>`<div class="card" style="padding:14px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin:-4px 0 8px"><b style="color:var(--brown);font-family:'Playfair Display',serif">Data ${i+1}</b>${fly.dias.length>1?`<button class="icon-btn" data-rm="${i}" aria-label="Remover" style="width:36px;height:36px">${IC.x}</button>`:''}</div>
      <div class="row"><input class="inp" data-i="${i}" data-k="data" value="${esc(d.data)}" placeholder="Ex.: Sábado, 8 de novembro"><button class="btn soft" data-cal="${i}" style="flex:0 0 56px;padding:0">${IC.cal}</button></div>
      <input class="inp" data-i="${i}" data-k="horas" value="${esc(d.horas)}" placeholder="Horários: 09:00, 13:00, 16:00" style="margin-top:10px">
    </div>`).join('')+(fly.dias.length<MAX_DIAS?`<button class="btn ghost" id="bAddD" style="margin-top:12px">${IC.plus} Adicionar outra data</button>`:'');
    box.querySelectorAll('input[data-i]').forEach(inp=>inp.oninput=()=>{fly.dias[inp.dataset.i][inp.dataset.k]=inp.value;redraw()});
    box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{fly.dias.splice(+b.dataset.rm,1);dd();redraw();aviso('Data removida')});
    box.querySelectorAll('[data-cal]').forEach(b=>b.onclick=async()=>{const i=+b.dataset.cal;
      const d=await escolherData('Escolha o dia',null,x=>diaAberto(x));if(!d)return;
      const h=vagas(d,S.horario.passo);fly.dias[i]={data:cap(fmtData(d)),horas:h.join(', ')};dd();redraw();
      aviso(h.length?h.length+' horário(s) livre(s) preenchido(s)':'Esse dia não tem horários livres',h.length?'':'err')});
    const add=$('#bAddD');if(add)add.onclick=()=>{fly.dias.push({data:'',horas:''});dd();setTimeout(()=>box.lastElementChild.previousElementSibling?.scrollIntoView({behavior:'smooth',block:'center'}),50)};
  };
  dd();
  const blob=()=>new Promise(r=>cv.toBlob(r,'image/png'));
  $('#bDl').onclick=async()=>{await desenharFlyer(cv);const b=await blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='flyer-vagas-'+Date.now()+'.png';document.body.appendChild(a);a.click();a.remove();aviso('Imagem baixada')};
  $('#bSh').onclick=async()=>{await desenharFlyer(cv);const b=await blob();const f=new File([b],'flyer-vagas.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}}else aviso('Compartilhamento indisponível aqui. Use “Baixar”.','err')};
  desenharFlyer(cv);
}};

/* ===== FINANCEIRO ===== */
let periodo='mes';
T.financeiro={titulo:'Financeiro',admin:true,render(v){
  const[ini,fim]=intervalo(periodo);const f=faturado(ini,fim);
  const prev=S.ags.filter(a=>a.status==='agendado'&&a.data>=ini&&a.data<=fim&&a.data>=hoje());
  const porServ={};f.ag.forEach(a=>{porServ[a.servNome]=porServ[a.servNome]||{q:0,v:0};porServ[a.servNome].q++;porServ[a.servNome].v+=Number(a.preco)});
  if(f.ex.length)porServ['Lançamentos avulsos']={q:f.ex.length,v:f.ex.reduce((s,e)=>s+Number(e.valor),0)};
  const mx=Math.max(1,...Object.values(porServ).map(x=>x.v));
  const lanc=[...f.ag.map(a=>({id:a.id,data:a.data,t:a.cliente,s:a.servNome,v:a.preco,ex:false})),...f.ex.map(e=>({id:e.id,data:e.data,t:e.desc,s:'Avulso',v:e.valor,ex:true}))].sort((a,b)=>b.data.localeCompare(a.data));
  v.innerHTML=`<div class="chips" id="per"></div>
  <div class="card" style="margin-top:14px"><span class="small muted">Total recebido</span><div class="big">${brl(f.total)}</div>
   <div class="row" style="margin-top:12px"><div><span class="small muted">Atendimentos</span><div style="font-weight:700;font-size:20px;color:var(--brown)">${f.qtd}</div></div>
   <div><span class="small muted">Ticket médio</span><div style="font-weight:700;font-size:20px;color:var(--brown)">${brl(f.qtd?f.total/f.qtd:0)}</div></div></div></div>
  ${prev.length?`<div class="card"><span class="small muted">Previsto (agendados a fazer)</span><div style="font-weight:700;font-size:20px;color:var(--brown2)">${brl(prev.reduce((s,a)=>s+Number(a.preco),0))} · ${prev.length} atend.</div></div>`:''}
  ${Object.keys(porServ).length?`<div class="sec-t">Por serviço</div><div class="card">${Object.entries(porServ).sort((a,b)=>b[1].v-a[1].v).map(([n,x])=>`<div class="bar-row"><div class="l"><span>${esc(n)} <span class="muted">(${x.q})</span></span><b>${brl(x.v)}</b></div><div class="t"><i style="width:${x.v/mx*100}%"></i></div></div>`).join('')}</div>`:''}
  <div class="sec-t">Lançamentos</div>
  ${lanc.length?lanc.map(l=>`<div class="list-item" ${l.ex?`data-ex="${l.id}"`:''}><div class="li-main"><div class="li-t">${esc(l.t)}</div><div class="li-s">${fmtCurta(l.data)} · ${esc(l.s)}</div></div><div class="li-v">${brl(l.v)}</div></div>`).join(''):'<div class="card empty">Nenhum atendimento concluído neste período.<br><span class="small">Conclua os atendimentos na Agenda para somarem aqui.</span></div>'}
  <button class="btn ghost" id="bEx" style="margin-top:14px">${IC.plus} Lançamento avulso</button>`;
  $('#per').innerHTML=[['hoje','Hoje'],['semana','Semana'],['mes','Mês'],['ano','Ano'],['tudo','Tudo']].map(([k,n])=>`<button class="chip ${periodo===k?'on':''}" data-k="${k}">${n}</button>`).join('');
  $('#per').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{periodo=b.dataset.k;desenhar()});
  v.querySelectorAll('[data-ex]').forEach(b=>b.onclick=async()=>{if(await confirmar('Excluir lançamento','Remover este lançamento avulso?','Excluir',true)){op(()=>deleteDoc(doc(db,'lancamentos',b.dataset.ex)),'Lançamento removido')}});
  $('#bEx').onclick=()=>{let dt=hoje();
    modal({titulo:'Lançamento avulso',corpo:`<label class="field"><span>Descrição</span><input class="inp" id="mDs" placeholder="Ex.: Atendimento sem agendamento"></label>
     <label class="field"><span>Valor (R$)</span><input class="inp" id="mVl" inputmode="decimal" placeholder="0,00"></label>
     <div class="field"><span>Data</span><button class="btn soft" id="mDt">${IC.cal} <span>${cap(fmtData(dt))}</span></button></div>`,
     aoAbrir:m=>{m.querySelector('#mDt').onclick=()=>{const cal=document.createElement('div');cal.style.marginTop='10px';const alvo=m.querySelector('#mDt');
       if(m.querySelector('.cal'))return;alvo.after(cal);calendario(cal,{sel:dt,escolher:d=>{dt=d;alvo.querySelector('span').textContent=cap(fmtData(d));cal.remove()}})}},
     botoes:[{texto:'Salvar',acao:m=>{const ds=m.querySelector('#mDs'),vl=m.querySelector('#mVl');const val=parseFloat(vl.value.replace(/\./g,'').replace(',','.'));
       if(ds.value.trim().length<2){erroCampo(ds,'Digite uma descrição');return false}
       if(isNaN(val)||val<=0){erroCampo(vl,'Digite um valor válido');return false}
       return op(()=>setDoc(doc(db,'lancamentos',uid()),{data:dt,desc:ds.value.trim().slice(0,80),valor:val}),'Lançamento salvo')}}]});
  };
}};

/* ===== CONFIGURAÇÕES ===== */
T.config={titulo:'Configurações',admin:true,render(v){
  v.innerHTML=`<label class="field"><span>Nome da profissional</span><input class="inp" id="cN" value="${esc(S.cfg.nome)}"></label>
  <label class="field"><span>Seu WhatsApp (recebe avisos e aparece no flyer)</span><input class="inp" id="cW" inputmode="numeric" value="${esc(fone(S.cfg.whats))}" placeholder="(21) 99999-9999"></label>
  <label class="field"><span>Mensagem do lembrete</span><textarea class="inp" id="cM" style="min-height:120px">${esc(S.cfg.msg)}</textarea></label>
  <p class="small muted" style="margin:6px 2px 0">Use {nome}, {data}, {hora} e {servico} — o app troca pelos dados da cliente.</p>
  <button class="btn" id="cSalvar" style="margin-top:16px">${IC.check} Salvar</button>
  <div class="sec-t">Segurança</div>
  <button class="list-item" id="cSenha">${IC.lock}<div class="li-main"><div class="li-t">Alterar senha</div></div>${IC.chev}</button>
  <button class="list-item" id="cSair">${IC.out}<div class="li-main"><div class="li-t">Sair do painel</div></div>${IC.chev}</button>
  <div class="sec-t">Link para clientes</div>
  <button class="list-item" id="cLink">${IC.share}<div class="li-main"><div class="li-t">Copiar link de agendamento</div><div class="li-s">Para mandar às clientes ou colocar na bio</div></div></button>`;
  const w=$('#cW');w.oninput=()=>{w.value=fone(w.value)};
  $('#cSalvar').onclick=()=>{const n=$('#cN').value.trim();if(n.length<2)return erroCampo($('#cN'),'Digite o nome');
    const t=soNum(w.value);if(t&&t.length<10)return erroCampo(w,'WhatsApp inválido');
    S.cfg.nome=n;S.cfg.whats=t;S.cfg.msg=$('#cM').value.trim()||S.cfg.msg;op(()=>gravarCfgAgora(),'Configurações salvas')};
  $('#cSenha').onclick=()=>modal({titulo:'Alterar senha',corpo:`<label class="field"><span>Senha atual</span><input class="inp" type="password" id="mA" autocomplete="current-password"></label>
    <label class="field"><span>Nova senha (mínimo 6 caracteres)</span><input class="inp" type="password" id="mNv" autocomplete="new-password"></label>
    <label class="field"><span>Repita a nova senha</span><input class="inp" type="password" id="mNv2" autocomplete="new-password"></label>`,
    botoes:[{texto:'Salvar',acao:async m=>{const a=m.querySelector('#mA'),n=m.querySelector('#mNv'),n2=m.querySelector('#mNv2');
      if(!a.value){erroCampo(a,'Digite a senha atual');return false}
      if(n.value.length<6){erroCampo(n,'Use pelo menos 6 caracteres');return false}
      if(n.value!==n2.value){erroCampo(n2,'As senhas não são iguais');return false}
      try{const u=auth.currentUser;await reauthenticateWithCredential(u,EmailAuthProvider.credential(DONA_EMAIL,a.value));await updatePassword(u,n.value)}
      catch(e){const c=e&&e.code||'';if(c.includes('network'))aviso('Sem internet. Tente de novo.','err');else erroCampo(a,'Senha atual incorreta');return false}
    },depois:()=>aviso('Senha alterada com sucesso')}]});
  $('#cSair').onclick=async()=>{if(await confirmar('Sair','Deseja sair do painel?','Sair')){await op(()=>signOut(auth));logado=false;irInicio();aviso('Você saiu do painel')}};
  $('#cLink').onclick=async()=>{const url=location.href.split('#')[0];try{await navigator.clipboard.writeText(url);aviso('Link copiado!')}catch(e){modal({titulo:'Link de agendamento',corpo:`<p style="word-break:break-all"><b>${esc(url)}</b></p>`})}};
}};

/* ---------- fundo com pontinhos dourados ---------- */
(function(){const cv=$('#specks'),c=cv.getContext('2d');const d=()=>{cv.width=innerWidth;cv.height=innerHeight;let s=3;const r=()=>{s=(s*9301+49297)%233280;return s/233280};
  for(let i=0;i<Math.round(innerWidth*innerHeight/9000);i++){c.fillStyle=`rgba(201,164,106,${.15+r()*.35})`;c.beginPath();c.ellipse(r()*cv.width,r()*cv.height,1+r()*3,1+r()*2.2,r()*3,0,7);c.fill()}};d();addEventListener('resize',d)})();

/* ---------- início ---------- */
pilha.push({nome:'home',params:{}});history.replaceState({p:1},'');
$('#bar').classList.add('hidden');
$('#view').innerHTML=`<div class="splash"><img src="${LOGO}"><div class="spin"></div></div>`;
</script>
</body>
